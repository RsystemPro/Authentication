openapi: 3.0.3
info:
  title: ViraBoard API
  version: 1.0.0
  description: |
    REST API. Module definitions are maintained in *.openapi.yaml files beside
    their controllers and combined at startup. All errors use the shared envelope.
servers:
  - url: /
    description: Current backend origin
tags:
  - name: App
    description: Application endpoints
paths:
  /:
    get:
      tags: [App]
      operationId: AppController_getHello
      summary: Get the application greeting
      security: []
      responses:
        '200':
          description: Application greeting
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            text/html:
              schema:
                type: string
                example: Hello World!
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  headers:
    RequestId:
      description: Request correlation identifier
      schema:
        type: string
  schemas:
    HttpError:
      type: object
      required: [statusCode, error, message, timestamp, path, requestId]
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /auth/login
        requestId:
          type: string
  responses:
    BadRequest:
      description: Invalid input, invalid session cursor, weak/breached password, or invalid/expired/consumed one-time token
      headers: &errorHeaders
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content: &errorContent
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    Unauthorized:
      description: Missing/invalid credentials, unverified/disabled account, or inactive session
      headers: *errorHeaders
      content: *errorContent
    Forbidden:
      description: Missing/untrusted Origin, missing X-CSRF-Protection value 1, or disallowed Fetch Metadata
      headers: *errorHeaders
      content: *errorContent
    NotFound:
      description: Session does not exist or is not owned by the current user
      headers: *errorHeaders
      content: *errorContent
    TooManyRequests:
      description: Rate limit exceeded; wait for Retry-After seconds before retrying
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until another attempt is allowed
          schema:
            type: integer
      content: *errorContent
    ServiceUnavailable:
      description: Required Redis or compromised-password screening service is unavailable
      headers: *errorHeaders
      content: *errorContent
    UnexpectedError:
      description: Unexpected server error; internal details are never returned
      headers: *errorHeaders
      content: *errorContent
